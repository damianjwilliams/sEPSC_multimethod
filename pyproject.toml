[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsc-multimethod"
version = "0.1.0"
description = "Run every synaptic-event detector on one recording, then review which method found which event"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["electrophysiology", "patch-clamp", "sEPSC", "mEPSC", "abf",
            "event detection", "consensus", "miniML"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyabf>=2.3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13"]
dev = ["pytest>=7.0"]

[project.scripts]
sepsc-multimethod = "multimethod.cli:main"

[tool.setuptools]
packages = ["multimethod", "multimethod.detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
